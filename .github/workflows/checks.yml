name: Checks
on:
  push:
    branches: [main]
    paths: ["android/**", "macos/**", "scripts/**", ".github/**"]
  pull_request:
  workflow_dispatch:
concurrency:
  group: kunnect-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  macos:
    timeout-minutes: 15
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift run --package-path macos KunnectChecks
      - run: swift run --package-path macos KunnectWireChecks
      - run: swift build --package-path macos --product KunnectDiskChecks
      - run: ./scripts/build-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: output/Kunnect-macOS-arm64.dmg
  android:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - run: ./android/gradlew --max-workers=2 -p android :app:assembleDebug :app:testDebugUnitTest :app:lintDebug :app:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
